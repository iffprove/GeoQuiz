<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>GeoTrivia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --surface2:#334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --correct: #4ade80;
      --wrong:   #f87171;
      --accent:  #38bdf8;
      --border:  #334155;
      --r:       12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 480px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .brand { font-size: 1.15rem; font-weight: 800; letter-spacing: -.03em; white-space: nowrap; }
    .brand span { color: var(--accent); }

    .hdr-right { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }

    .streak { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
    .streak strong { color: var(--text); }
    .freeze-badge { font-size: .78rem; color: #93c5fd; }

    select, .mode-toggle {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: .82rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .mode-toggle { font-weight: 600; transition: background .15s; }
    .mode-toggle:hover { background: var(--surface2); }
    .mode-toggle.locked { opacity: .45; cursor: default; }

    main {
      width: 100%;
      max-width: 480px;
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .day-tag {
      font-size: .7rem;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .practice-day-tag {
      font-size: .7rem;
      color: var(--accent);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .08em;
      background: rgba(56,189,248,.08);
      border-radius: 4px;
      padding: 3px 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px;
    }

    .q-label {
      font-size: .68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 10px;
    }

    #question-text {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
    }

    /* ── Text-input mode ── */
    .answer-row { display: flex; gap: 8px; }

    #answer-input {
      flex: 1;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 11px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    #answer-input:focus   { border-color: var(--accent); }
    #answer-input:disabled { opacity: .4; cursor: not-allowed; }

    #submit-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: var(--r);
      padding: 11px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    #submit-btn:hover:not(:disabled) { opacity: .85; }
    #submit-btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ── MC mode ── */
    .mc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mc-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 10px;
      font-size: .92rem;
      font-weight: 500;
      cursor: pointer;
      line-height: 1.35;
      text-align: center;
      transition: background .12s, border-color .12s, color .12s;
    }
    .mc-btn:hover:not(:disabled):not(.revealed-correct):not(.wrong) {
      background: var(--surface2);
      border-color: var(--accent);
    }
    .mc-btn.wrong {
      border-color: var(--wrong);
      color: var(--muted);
      cursor: not-allowed;
    }
    .mc-btn.correct, .mc-btn.revealed-correct {
      border-color: var(--correct);
      background: #162b1f;
      color: var(--correct);
      font-weight: 700;
    }
    .mc-btn:disabled { cursor: not-allowed; }

    /* ── Attempts ── */
    #attempts-label {
      font-size: .73rem;
      color: var(--muted);
      text-align: center;
      min-height: 1em;
    }

    /* ── Guess history ── */
    .guesses { display: flex; flex-direction: column; gap: 7px; }

    .guess {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 13px;
      font-size: .92rem;
      animation: slide-in .18s ease-out;
    }
    .guess.correct { border-color: var(--correct); }
    .guess.wrong   { color: var(--muted); }
    .gi { flex-shrink: 0; }
    .guess.correct .gi::before { content: '✓'; color: var(--correct); font-weight: 700; }
    .guess.wrong   .gi::before { content: '✗'; color: var(--wrong); }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-5px); }
      40%,80%  { transform: translateX(5px); }
    }
    .shake { animation: shake .3s ease-out; }

    /* ── Hint ── */
    .hint-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--r);
      padding: 10px 14px;
      font-size: .85rem;
      color: var(--muted);
      animation: slide-in .25s ease-out;
    }
    .hint-label {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* ── Result panel ── */
    .result { display: flex; flex-direction: column; gap: 11px; }
    .result-title { font-size: 1.1rem; font-weight: 700; text-align: center; }
    .result-title.win  { color: var(--correct); }
    .result-title.lose { color: var(--wrong); }
    .result-answer { font-size: .86rem; color: var(--muted); text-align: center; }
    .result-answer strong { color: var(--text); }

    .commentary {
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: var(--r);
      padding: 12px 16px;
      font-size: .9rem;
      font-style: italic;
      color: var(--text);
      text-align: center;
      line-height: 1.5;
      animation: slide-in .3s ease-out;
    }

    .fun-fact {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 11px 14px;
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .fun-fact-label {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    hr { border: none; border-top: 1px solid var(--border); }

    .share-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #0f172a;
      border: 1px solid var(--accent); border-radius: 8px;
      padding: 10px; font-size: .88rem; font-weight: 700;
      cursor: pointer; width: 100%; transition: background .15s, border-color .15s;
    }
    .share-btn:hover { background: #7dd3fc; border-color: #7dd3fc; }

    .share-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .share-sheet {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; max-width: 500px; width: 100%;
      display: flex; flex-direction: column; gap: 12px;
    }
    .share-sheet-top {
      display: flex; align-items: center; justify-content: space-between;
    }
    .share-sheet-title {
      font-size: .75rem; font-weight: 700; color: var(--muted);
      letter-spacing: .07em; text-transform: uppercase;
    }
    .share-close-btn {
      background: none; border: none; color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1;
    }
    .share-close-btn:hover { background: var(--surface2); color: var(--text); }
    .share-preview { width: 100%; border-radius: 10px; overflow: hidden; line-height: 0; }
    .share-sheet-actions { display: flex; gap: 8px; }
    .share-sheet-btn {
      flex: 1; padding: 10px 4px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: .82rem; font-weight: 600;
      cursor: pointer; transition: background .15s; text-align: center;
    }
    .share-sheet-btn:hover { background: var(--border); }
    .share-sheet-btn.primary {
      background: var(--accent); color: #0f172a; border-color: var(--accent);
    }
    .share-sheet-btn.primary:hover { background: #7dd3fc; border-color: #7dd3fc; }

    .countdown { font-size: .78rem; color: var(--muted); text-align: center; }

    .practice-next-btn {
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 8px;
      padding: 10px; font-size: .88rem; font-weight: 600;
      cursor: pointer; width: 100%; transition: background .15s;
    }
    .practice-next-btn:hover { background: rgba(56,189,248,.1); }

    .endless-hint-wrap { display: flex; flex-direction: column; gap: 6px; }
    .endless-hint-label {
      font-size: .68rem; color: var(--accent);
      text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
    }
    .endless-hint-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .endless-hint-btn {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--accent); border-radius: var(--r);
      padding: 11px 8px; font-size: .88rem; font-weight: 500;
      cursor: pointer; line-height: 1.35; text-align: center;
      transition: background .12s, opacity .12s;
    }
    .endless-hint-btn:hover:not(:disabled) { background: rgba(56,189,248,.12); }

    .view-tabs {
      width: 100%; max-width: 480px;
      display: flex; padding: 0 18px;
      border-bottom: 1px solid var(--border);
    }
    .view-tab {
      padding: 10px 16px 9px;
      background: none; color: var(--muted);
      border: none; border-bottom: 2px solid transparent;
      font-size: .85rem; font-weight: 700;
      cursor: pointer; transition: color .15s, border-color .15s;
      margin-bottom: -1px;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .loading {
      display: flex; align-items: center; justify-content: center;
      flex: 1; color: var(--muted); font-size: .9rem;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="brand">Geo<span>Trivia</span></div>
  <div class="hdr-right">
    <div class="streak">🔥 <strong id="streak-val">0</strong><span id="freeze-badge" class="freeze-badge" hidden>❄️</span></div>
    <button class="mode-toggle" id="mode-btn" hidden>MC</button>
    <select id="locale-pick">
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="fr">FR</option>
      <option value="ja">JA</option>
      <option value="pt">PT</option>
    </select>
  </div>
</header>

<nav class="view-tabs" id="view-tabs" hidden>
  <button class="view-tab active" id="tab-daily"></button>
  <button class="view-tab" id="tab-endless"></button>
</nav>

<main>
  <div class="loading" id="loading">Loading…</div>
</main>

<script>
/* ── Localization engine ─────────────────────────────────────────────────── */

function normalize(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
}
function loc(map, locale) { return map[locale] ?? map.en; }
function entityLabel(ents, id, locale) { return loc(ents[id].labels, locale); }

function entityAliases(ents, id, locale) {
  const e = ents[id];
  const la = e.aliases[locale] ?? [], ea = e.aliases.en ?? [];
  const seen = new Set(), out = [];
  for (const a of [...la, ...ea]) {
    const k = normalize(a);
    if (!seen.has(k)) { seen.add(k); out.push(a); }
  }
  return out;
}

function checkAnswer(ents, input, entityId, locale) {
  const n = normalize(input);
  return entityAliases(ents, entityId, locale).some(a => normalize(a) === n);
}

function renderQ(ents, tmpl, q, locale) {
  let text = loc(tmpl[q.template], locale);
  for (const [k, id] of Object.entries(q.params))
    text = text.replace(`{${k}}`, entityLabel(ents, id, locale));
  return text;
}

function uiS(ui, key, locale, vars = {}) {
  let s = loc(ui[key] ?? { en: key }, locale);
  for (const [k,v] of Object.entries(vars)) s = s.replace(`{${k}}`, v);
  return s;
}

/* ── Utilities ───────────────────────────────────────────────────────────── */

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isoToFlag(iso2) {
  return [...iso2.toUpperCase()].map(c =>
    String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65)
  ).join('');
}

function getVoice(flavor, qId, locale, field) {
  const entry = flavor?.[qId];
  if (!entry) return null;
  const map = entry[field];
  if (!map) return null;
  return map[locale] ?? map.en ?? null;
}

function getDayNumber() {
  const n = new Date();
  return Math.floor(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()) / 86400000);
}

function pickQuestion(questions, day) {
  const pool = questions.filter(q => q.template === 'capital_of_country');
  const step = Math.ceil(pool.length * 0.618);
  return pool[(day * step) % pool.length];
}

function shuffleOptions(arr, seed) {
  const a = [...arr];
  let s = seed >>> 0;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShareText(day, guesses, won, mode, locale, q, flavor) {
  const flag = isoToFlag(q.params.country);
  const grid = guesses.map((_, i) =>
    (won && i === guesses.length - 1) ? '✅' : '❌'
  ).join('');
  const commentary = getVoice(flavor, q.id, locale, 'commentary');
  const line = commentary ? (won ? commentary.correct : commentary.wrong) : null;
  const quote = line ? `\n"${line}"` : '';
  return `GeoTrivia #${day} ${flag} · ${locale.toUpperCase()}\n${grid}${quote}\nhttps://iffprove.github.io/geoquiz`;
}

function canvasToBlob(cv) {
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

function buildShareCanvas(day, guesses, won, mode, locale, q, data) {
  const { ents, flavor } = data;
  const SCALE = Math.min(window.devicePixelRatio || 1, 3);
  const W = 600, H = 320;
  const cv  = document.createElement('canvas');
  cv.width  = W * SCALE;
  cv.height = H * SCALE;
  cv.style.cssText = `width:${W}px;height:${H}px;`;
  const ctx = cv.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.textBaseline = 'middle';

  const P = {
    bg: '#0f172a', surface: '#1e293b', surface2: '#334155',
    accent: '#38bdf8', text: '#f1f5f9', muted: '#94a3b8',
    correct: '#4ade80', wrong: '#f87171',
  };
  const F = 'system-ui,-apple-system,BlinkMacSystemFont,sans-serif';

  // Works for both question templates
  const countryId    = q.params.country || (ents[q.answer]?.type === 'country' ? q.answer : '');
  const flag         = countryId ? isoToFlag(countryId) : '🌍';
  const countryLabel = countryId ? entityLabel(ents, countryId, locale) : '';

  const LANG_ISO   = { en: 'US', es: 'ES', fr: 'FR', ja: 'JP', pt: 'BR' };
  const localeFlag = isoToFlag(LANG_ISO[locale] || 'US');

  const commentary = getVoice(flavor, q.id, locale, 'commentary');
  const verdict    = commentary ? (won ? commentary.correct : commentary.wrong) : null;

  // ── Background ───────────────────────────────────────────
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);

  // ── Header strip ─────────────────────────────────────────
  ctx.fillStyle = P.surface;
  ctx.fillRect(0, 0, W, 52);
  // Accent top stripe
  ctx.fillStyle = P.accent;
  ctx.fillRect(0, 0, W, 3);

  // Brand: "Geo" white + "Trivia" accent
  ctx.font = `bold 22px ${F}`;
  ctx.fillStyle = P.text;
  ctx.fillText('Geo', 20, 29);
  const geoW = ctx.measureText('Geo').width;
  ctx.fillStyle = P.accent;
  ctx.fillText('Trivia', 20 + geoW, 29);

  // Day number
  ctx.font = `600 13px ${F}`;
  ctx.fillStyle = P.muted;
  ctx.textAlign = 'right';
  ctx.fillText(`#${day}`, W - 20, 29);
  ctx.textAlign = 'left';

  // ── Country flag (hero) ───────────────────────────────────
  ctx.font = `58px ${F}`;
  ctx.textAlign = 'center';
  ctx.fillText(flag, W / 2, 108);

  // ── Country name ─────────────────────────────────────────
  ctx.font = `bold 26px ${F}`;
  ctx.fillStyle = P.text;
  ctx.fillText(countryLabel, W / 2, 156);

  // ── Separator ─────────────────────────────────────────────
  ctx.strokeStyle = P.surface2;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W * 0.15, 173);
  ctx.lineTo(W * 0.85, 173);
  ctx.stroke();

  // ── Guess dots ────────────────────────────────────────────
  const R = 11, GAP = 12, n = guesses.length;
  const rowW = n * R * 2 + (n - 1) * GAP;
  let dx = (W - rowW) / 2;
  const dotY = 204;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < n; i++) {
    const hit = won && i === n - 1;
    const cx  = dx + R;
    ctx.beginPath();
    ctx.arc(cx, dotY, R, 0, Math.PI * 2);
    ctx.fillStyle = hit ? P.correct : P.wrong;
    ctx.fill();
    ctx.strokeStyle = P.bg;
    ctx.lineWidth = 2.5;
    if (hit) {
      ctx.beginPath();
      ctx.moveTo(cx - 5,   dotY + 0.5);
      ctx.lineTo(cx - 1.5, dotY + 5);
      ctx.lineTo(cx + 6,   dotY - 5);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(cx - 4, dotY - 4); ctx.lineTo(cx + 4, dotY + 4);
      ctx.moveTo(cx + 4, dotY - 4); ctx.lineTo(cx - 4, dotY + 4);
      ctx.stroke();
    }
    dx += R * 2 + GAP;
  }

  // ── Verdict line ──────────────────────────────────────────
  if (verdict) {
    ctx.font = `italic 13px ${F}`;
    ctx.fillStyle = P.accent;
    ctx.textAlign = 'center';
    const maxW = W - 80;
    let txt = `“${verdict}”`;
    while (ctx.measureText(txt).width > maxW && txt.length > 6)
      txt = txt.slice(0, -2) + '…”';
    ctx.fillText(txt, W / 2, 240);
    ctx.textAlign = 'left';
  }

  // ── Footer strip ──────────────────────────────────────────
  ctx.fillStyle = P.surface;
  ctx.fillRect(0, H - 42, W, 42);
  ctx.font = `13px ${F}`;
  ctx.fillStyle = P.muted;
  ctx.textAlign = 'left';
  ctx.fillText(`${localeFlag} ${locale.toUpperCase()}`, 20, H - 21);
  ctx.textAlign = 'right';
  ctx.fillStyle = P.accent;
  ctx.fillText('iffprove.github.io/geoquiz', W - 20, H - 21);
  ctx.textAlign = 'left';

  return cv;
}

function showShareSheet(canvas, textFallback) {
  const overlay = document.createElement('div');
  overlay.className = 'share-overlay';

  const sheet = document.createElement('div');
  sheet.className = 'share-sheet';

  const top = document.createElement('div');
  top.className = 'share-sheet-top';
  top.innerHTML = '<span class="share-sheet-title">Your result</span>'
    + '<button class="share-close-btn" aria-label="Close">✕</button>';

  const preview = document.createElement('div');
  preview.className = 'share-preview';
  canvas.style.cssText = 'display:block;width:100%;height:auto;';
  preview.appendChild(canvas);

  const actions = document.createElement('div');
  actions.className = 'share-sheet-actions';

  function mkBtn(label, cls) {
    const b = document.createElement('button');
    b.className = 'share-sheet-btn' + (cls ? ' ' + cls : '');
    b.textContent = label;
    return b;
  }

  const copyImg = mkBtn('📋 Copy image', 'primary');
  const saveBtn = mkBtn('⬇ Save');
  const copyTxt = mkBtn('Copy text');

  copyImg.addEventListener('click', async () => {
    try {
      const blob = await canvasToBlob(canvas);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      copyImg.textContent = '✓ Copied!';
    } catch {
      try { await navigator.clipboard.writeText(textFallback); } catch { /* ignore */ }
      copyImg.textContent = '✓ Text copied';
    }
    setTimeout(() => { copyImg.textContent = '📋 Copy image'; }, 2500);
  });

  saveBtn.addEventListener('click', async () => {
    const blob = await canvasToBlob(canvas);
    const url  = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: 'geotrivia.png' }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  copyTxt.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(textFallback); } catch { /* ignore */ }
    copyTxt.textContent = '✓ Copied!';
    setTimeout(() => { copyTxt.textContent = 'Copy text'; }, 2500);
  });

  if (typeof navigator.share === 'function') {
    const shareBtn = mkBtn('Share…');
    shareBtn.addEventListener('click', async () => {
      try {
        const blob = await canvasToBlob(canvas);
        const file = new File([blob], 'geotrivia.png', { type: 'image/png' });
        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file], text: textFallback });
        } else {
          await navigator.share({ text: textFallback });
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          try { await navigator.clipboard.writeText(textFallback); } catch { /* ignore */ }
        }
      }
    });
    actions.append(copyImg, saveBtn, shareBtn);
  } else {
    actions.append(copyImg, saveBtn, copyTxt);
  }

  sheet.append(top, preview, actions);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  top.querySelector('.share-close-btn').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
}

function countdown() {
  const n = new Date();
  const ms = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + 1) - Date.now();
  const h = String(Math.floor(ms / 3600000)).padStart(2,'0');
  const m = String(Math.floor(ms % 3600000 / 60000)).padStart(2,'0');
  const s = String(Math.floor(ms % 60000 / 1000)).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

/* ── State ───────────────────────────────────────────────────────────────── */

const STORE = 'geotrivia_v1';
function loadState() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function saveState(s) { localStorage.setItem(STORE, JSON.stringify(s)); }
function getLocale() { return localStorage.getItem('geotrivia_locale') || 'en'; }
function setLocale(l) { localStorage.setItem('geotrivia_locale', l); }
function getMode()   { return localStorage.getItem('geotrivia_mode')   || 'mc'; }
function setMode(m)  { localStorage.setItem('geotrivia_mode', m); }

function setStreak(n, froze) {
  document.getElementById('streak-val').textContent = n;
  const badge = document.getElementById('freeze-badge');
  froze ? badge.removeAttribute('hidden') : badge.setAttribute('hidden', '');
}

const MAX_TEXT = 6;
const MAX_MC   = 4;

/* ── Practice session ────────────────────────────────────────────────────── */

let practiceSession = null;
let activeView = 'daily';

function startPractice(allQuestions, data, locale) {
  const pool = allQuestions.filter(q => q.template === 'capital_of_country');
  const indices = pool.map((_, i) => i);
  const shuffled = shuffleOptions(indices, Date.now() >>> 0).map(i => pool[i]);
  practiceSession = { questions: shuffled, index: 0, correct: 0, attempted: 0, hintOptions: null };
  mountPractice(data, locale);
}

function mountPractice(data, locale) {
  if (!practiceSession) return;
  if (practiceSession.index >= practiceSession.questions.length) {
    // Reshuffle the deck to keep endless going; preserve score
    const pool = practiceSession.questions;
    practiceSession.questions = shuffleOptions(pool.map((_, i) => i), Date.now() >>> 0).map(i => pool[i]);
    practiceSession.index = 0;
  }
  const q = practiceSession.questions[practiceSession.index];
  mount(data, 'practice', q, locale, {}, true);
}

function refreshEndlessTag(ui, locale) {
  const tag = document.querySelector('.practice-day-tag');
  if (!tag || !practiceSession) return;
  const base = uiS(ui, 'tab_endless', locale);
  tag.textContent = practiceSession.attempted > 0
    ? `${base} · ${practiceSession.correct} / ${practiceSession.attempted}`
    : base;
}

function showEndlessHint(data, q, locale, state, wrongCount) {
  if (!practiceSession) return;
  const distractors = data.flavor[q.id]?.distractors ?? [];
  if (!distractors.length) return;

  if (!practiceSession.hintOptions) {
    // First wrong: build 4 options (answer + up to 3 distractors)
    const pool = [q.answer, ...distractors.slice(0, 3)];
    const seed = [...q.id].reduce((a, c) => a + c.charCodeAt(0), 0);
    practiceSession.hintOptions = shuffleOptions(pool, seed);
  } else if (practiceSession.hintOptions.length > 2) {
    // Second wrong: narrow to answer + 1 remaining distractor
    const wrong = practiceSession.hintOptions.filter(id => id !== q.answer);
    practiceSession.hintOptions = shuffleOptions([q.answer, wrong[0]], 137);
  }
  // At 2 options, stay at 2 until game ends

  renderEndlessHint(data, q, locale, state);
}

function renderEndlessHint(data, q, locale, state) {
  const { ents } = data;
  const area = document.getElementById('endless-hint-area');
  if (!area || !practiceSession?.hintOptions?.length) return;

  area.innerHTML = `
    <div class="endless-hint-wrap">
      <p class="endless-hint-label">Pick one</p>
      <div class="endless-hint-grid">
        ${practiceSession.hintOptions.map(id =>
          `<button class="endless-hint-btn" data-id="${esc(id)}">${esc(entityLabel(ents, id, locale))}</button>`
        ).join('')}
      </div>
    </div>`;

  area.querySelectorAll('.endless-hint-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById('answer-input');
      if (!input || input.disabled) return;
      input.value = entityLabel(ents, btn.dataset.id, locale);
      submitText(data, 'practice', q, locale, state, true);
    });
  });
}

/* ── Mount ───────────────────────────────────────────────────────────────── */

function mount(data, day, q, locale, state, isPractice) {
  const { ents, tmpl, ui, flavor } = data;
  const savedDay = isPractice ? null : state.days?.[day];
  const guesses  = savedDay?.guesses ?? [];
  const won      = savedDay?.won     ?? false;
  const mode     = isPractice ? 'text' : (savedDay?.mode ?? (flavor[q.id] ? getMode() : 'text'));
  const max      = mode === 'mc' ? MAX_MC : MAX_TEXT;
  const done     = won || guesses.length >= max;

  const qText      = renderQ(ents, tmpl, q, locale);
  const placeholder = uiS(ui, 'enter_answer', locale).trim();

  const endlessScore = isPractice && practiceSession && practiceSession.attempted > 0
    ? ` · ${practiceSession.correct} / ${practiceSession.attempted}` : '';
  const dayTagHTML = isPractice
    ? `<p class="practice-day-tag">${esc(uiS(ui, 'tab_endless', locale) + endlessScore)}</p>`
    : `<p class="day-tag">Daily Puzzle · Day #${day}</p>`;

  document.querySelector('main').innerHTML = `
    ${dayTagHTML}
    <div class="card">
      <p class="q-label">Question</p>
      <p id="question-text">${esc(qText)}</p>
    </div>
    ${mode === 'mc'
      ? renderMCHTML(ents, q, locale, flavor, day, guesses, won, done)
      : `<div class="answer-row">
           <input id="answer-input" type="text" autocomplete="off" spellcheck="false"
                  placeholder="${esc(placeholder)}" ${done ? 'disabled' : ''} />
           <button id="submit-btn" ${done ? 'disabled' : ''}>→</button>
         </div>`
    }
    <p id="attempts-label">${done ? '' : attemptsLabel(mode, guesses.length, max)}</p>
    ${mode === 'text' && !done && isPractice ? '<div id="endless-hint-area"></div>' : ''}
    ${mode === 'text' && !done ? '<div id="hint-area"></div>' : ''}
    <div class="guesses" id="guesses"></div>
    <div class="card" id="result-card" ${done ? '' : 'hidden'}></div>
  `;

  guesses.forEach((g, i) => {
    const correct = won && i === guesses.length - 1;
    addRow(mode === 'text' ? g : entityLabel(ents, g, locale), correct);
  });

  // Restore hint if game was already in progress with ≥ 2 wrong guesses
  if (mode === 'text' && !done && guesses.length >= 2) {
    showHint(data, q, locale);
  }

  if (done) renderResult(data, day, q, locale, guesses, won, mode, isPractice);

  if (mode === 'mc') {
    wireMC(data, day, q, locale, state, guesses, won, done, isPractice);
  } else {
    document.getElementById('submit-btn').addEventListener('click', () =>
      submitText(data, day, q, locale, state, isPractice));
    document.getElementById('answer-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitText(data, day, q, locale, state, isPractice);
    });
    if (!done) document.getElementById('answer-input').focus();
  }
}

function attemptsLabel(mode, used, max) {
  if (mode === 'mc') return `${max - used} option${max - used !== 1 ? 's' : ''} remaining`;
  return `${used} / ${max} guesses`;
}

/* ── Hint ────────────────────────────────────────────────────────────────── */

function showHint(data, q, locale) {
  const { ui, flavor } = data;
  if (document.getElementById('hint-block')) return;
  const hint = getVoice(flavor, q.id, locale, 'hint');
  if (!hint) return;
  const area = document.getElementById('hint-area');
  if (!area) return;
  area.innerHTML = `<div class="hint-block" id="hint-block">
    <p class="hint-label">${esc(uiS(ui, 'hint_label', locale))}</p>
    <p>${esc(hint)}</p>
  </div>`;
}

/* ── MC rendering ────────────────────────────────────────────────────────── */

function getMCOptions(ents, q, locale, flavor, day) {
  const distractors = flavor[q.id]?.distractors ?? [];
  const options = [q.answer, ...distractors.slice(0, 3)];
  return shuffleOptions(options, typeof day === 'number' ? day : 0).map(id => ({
    id,
    label: entityLabel(ents, id, locale),
  }));
}

function renderMCHTML(ents, q, locale, flavor, day, guesses, won, done) {
  const options  = getMCOptions(ents, q, locale, flavor, day);
  const wrongSet = new Set(guesses.filter(g => !won || g !== q.answer));
  const correctId = won ? q.answer : null;

  const buttons = options.map(opt => {
    let cls = 'mc-btn', dis = '';
    if (opt.id === correctId)        { cls += ' correct';          dis = 'disabled'; }
    else if (wrongSet.has(opt.id))   { cls += ' wrong';            dis = 'disabled'; }
    else if (done)                   { dis = 'disabled'; }
    return `<button class="${cls}" data-id="${esc(opt.id)}" ${dis}>${esc(opt.label)}</button>`;
  }).join('');

  // On loss: reveal the correct answer among buttons
  if (done && !won) {
    const grid = `<div class="mc-grid" id="mc-grid">${buttons}</div>`;
    const parser = new DOMParser();
    const doc = parser.parseFromString(grid, 'text/html');
    const answerBtn = doc.querySelector(`[data-id="${q.answer}"]`);
    if (answerBtn) {
      answerBtn.className = 'mc-btn revealed-correct';
      answerBtn.setAttribute('disabled', '');
    }
    return doc.body.firstChild.outerHTML;
  }

  return `<div class="mc-grid" id="mc-grid">${buttons}</div>`;
}

function wireMC(data, day, q, locale, state, savedGuesses, savedWon, done, isPractice) {
  if (done) return;
  const grid = document.getElementById('mc-grid');
  if (!grid) return;
  grid.addEventListener('click', e => {
    const btn = e.target.closest('.mc-btn');
    if (!btn || btn.disabled) return;
    handleMCClick(data, day, q, locale, state, btn.dataset.id, btn, grid, isPractice);
  });
}

function handleMCClick(data, day, q, locale, state, clickedId, btn, grid, isPractice) {
  const { ents, flavor } = data;
  const stateKey = isPractice ? 'practice' : day;
  const saved    = state.days?.[stateKey] ?? { guesses: [], won: false, mode: 'mc' };
  if (saved.won || saved.guesses.length >= MAX_MC) return;

  const correct    = clickedId === q.answer;
  const newGuesses = [...saved.guesses, clickedId];
  const nowDone    = correct || newGuesses.length >= MAX_MC;

  if (!isPractice) {
    state.days = state.days ?? {};
    state.days[day] = { guesses: newGuesses, won: correct, mode: 'mc' };
    if (correct) {
      const froze = state.frozeStreak && state.lastWonDay === day - 2;
      const extended = state.lastWonDay === day - 1 || froze;
      state.streak     = extended ? (state.streak ?? 0) + 1 : 1;
      state.frozeStreak = false;
      state.lastWonDay  = day;
    } else if (nowDone) {
      state.streak = 0;
    }
    saveState(state);
    setStreak(state.streak ?? 0, state.frozeStreak);
  } else {
    state.days = state.days ?? {};
    state.days['practice'] = { guesses: newGuesses, won: correct, mode: 'mc' };
  }

  if (isPractice && nowDone && practiceSession) {
    practiceSession.attempted++;
    if (correct) practiceSession.correct++;
    refreshEndlessTag(data.ui, locale);
  }

  btn.disabled = true;
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    btn.classList.add('shake');
    btn.addEventListener('animationend', () => btn.classList.remove('shake'), { once: true });
  }

  addRow(entityLabel(ents, clickedId, locale), correct);

  document.getElementById('attempts-label').textContent =
    nowDone ? '' : attemptsLabel('mc', newGuesses.length, MAX_MC);

  if (nowDone) {
    grid.querySelectorAll('.mc-btn').forEach(b => {
      b.disabled = true;
      if (!correct && b.dataset.id === q.answer) {
        b.classList.remove('wrong');
        b.classList.add('revealed-correct');
      }
    });
    document.getElementById('result-card').removeAttribute('hidden');
    renderResult(data, day, q, locale, newGuesses, correct, 'mc', isPractice);
  }
}

/* ── Text-input mode ─────────────────────────────────────────────────────── */

function submitText(data, day, q, locale, state, isPractice) {
  const input = document.getElementById('answer-input');
  const val   = input.value.trim();
  if (!val) return;

  const { ents } = data;
  const stateKey = isPractice ? 'practice' : day;
  const saved    = state.days?.[stateKey] ?? { guesses: [], won: false, mode: 'text' };
  if (saved.won || saved.guesses.length >= MAX_TEXT) return;

  const correct    = checkAnswer(ents, val, q.answer, locale);
  const newGuesses = [...saved.guesses, val];
  const nowDone    = correct || newGuesses.length >= MAX_TEXT;

  if (!isPractice) {
    state.days = state.days ?? {};
    state.days[day] = { guesses: newGuesses, won: correct, mode: 'text' };
    if (correct) {
      const froze    = state.frozeStreak && state.lastWonDay === day - 2;
      const extended = state.lastWonDay === day - 1 || froze;
      state.streak     = extended ? (state.streak ?? 0) + 1 : 1;
      state.frozeStreak = false;
      state.lastWonDay  = day;
    } else if (nowDone) {
      state.streak = 0;
    }
    saveState(state);
    setStreak(state.streak ?? 0, state.frozeStreak);
  } else {
    state.days = state.days ?? {};
    state.days['practice'] = { guesses: newGuesses, won: correct, mode: 'text' };
  }

  if (isPractice && nowDone && practiceSession) {
    practiceSession.attempted++;
    if (correct) practiceSession.correct++;
    refreshEndlessTag(data.ui, locale);
  }

  input.value = '';
  addRow(val, correct);

  if (!correct && !nowDone) {
    input.classList.add('shake');
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
    // Show hint after 2nd wrong guess
    if (newGuesses.length >= 2) showHint(data, q, locale);
    // Show / narrow MC lifeline in endless mode
    if (isPractice) showEndlessHint(data, q, locale, state, newGuesses.length);
  }

  document.getElementById('attempts-label').textContent =
    nowDone ? '' : attemptsLabel('text', newGuesses.length, MAX_TEXT);

  if (nowDone) {
    input.disabled = true;
    document.getElementById('submit-btn').disabled = true;
    const hintArea = document.getElementById('hint-area');
    if (hintArea) hintArea.remove();
    const endlessHintArea = document.getElementById('endless-hint-area');
    if (endlessHintArea) endlessHintArea.remove();
    document.getElementById('result-card').removeAttribute('hidden');
    renderResult(data, day, q, locale, newGuesses, correct, 'text', isPractice);
  }
}

/* ── Shared helpers ──────────────────────────────────────────────────────── */

function addRow(displayText, correct) {
  const el = document.createElement('div');
  el.className = `guess ${correct ? 'correct' : 'wrong'}`;
  el.innerHTML = `<i class="gi"></i><span>${esc(displayText)}</span>`;
  document.getElementById('guesses').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderResult(data, day, q, locale, guesses, won, mode, isPractice) {
  const { ents, ui, flavor } = data;
  const ansLabel = entityLabel(ents, q.answer, locale);
  const card     = document.getElementById('result-card');

  const commentary  = getVoice(flavor, q.id, locale, 'commentary');
  const commentLine = commentary ? (won ? commentary.correct : commentary.wrong) : null;
  const funFact     = getVoice(flavor, q.id, locale, 'funFact');

  card.innerHTML = `
    <div class="result">
      <p class="result-title ${won ? 'win' : 'lose'}">
        ${esc(uiS(ui, won ? 'correct' : 'game_over', locale))}
      </p>
      ${!won ? `<p class="result-answer">${esc(uiS(ui,'wrong',locale,{answer:ansLabel}))}</p>` : ''}
      ${commentLine ? `<p class="commentary">"${esc(commentLine)}"</p>` : ''}
      ${funFact ? `
        <div class="fun-fact">
          <p class="fun-fact-label">${esc(uiS(ui, 'fun_fact_label', locale))}</p>
          <p>${esc(funFact)}</p>
        </div>` : ''}
      <hr />
      ${!isPractice ? `<button class="share-btn" id="share-btn">↗ ${esc(uiS(ui, 'share_btn', locale))}</button>` : ''}
      ${isPractice
        ? `<button class="practice-next-btn" id="next-btn">→ Next question</button>`
        : `<p class="countdown" id="cd"></p>`
      }
    </div>
  `;

  if (!isPractice) {
    document.getElementById('share-btn').addEventListener('click', () => {
      const canvas = buildShareCanvas(day, guesses, won, mode, locale, q, data);
      const text   = buildShareText(day, guesses, won, mode, locale, q, flavor);
      showShareSheet(canvas, text);
    });
  }

  if (isPractice) {
    document.getElementById('next-btn').addEventListener('click', () => {
      if (practiceSession) {
        practiceSession.index++;
        practiceSession.hintOptions = null;
        mountPractice(data, locale);
      }
    });
  } else {
    const cdEl = document.getElementById('cd');
    function tick() { cdEl.textContent = `${uiS(ui, 'next_puzzle', locale)} ${countdown()}`; }
    tick();
    setInterval(tick, 1000);
  }
}

/* ── Boot ────────────────────────────────────────────────────────────────── */

(async () => {
  const [ents, tmpl, questions, ui, flavor] = await Promise.all([
    fetch('data/entities.json').then(r => r.json()),
    fetch('data/question_templates.json').then(r => r.json()),
    fetch('data/questions.json').then(r => r.json()),
    fetch('data/ui_strings.json').then(r => r.json()),
    fetch('data/flavor.json').then(r => r.json()).catch(() => ({})),
  ]);
  const data = { ents, tmpl, ui, flavor };

  const state  = loadState();
  let locale   = getLocale();
  const day    = getDayNumber();
  const q      = pickQuestion(questions, day);

  // Grant one freeze token per calendar week (max 2 banked)
  const weekNum = Math.floor(day / 7);
  if (state.lastFreezeGrantedWeek !== weekNum) {
    state.streakFreezes        = Math.min((state.streakFreezes ?? 0) + 1, 2);
    state.lastFreezeGrantedWeek = weekNum;
    saveState(state);
  }

  // Reset streak on missed day (with freeze support)
  if (!state.days?.[day]?.won && state.lastWonDay !== undefined && state.lastWonDay < day - 1) {
    const missedExactlyOne = state.lastWonDay === day - 2;
    if (missedExactlyOne && (state.streakFreezes ?? 0) > 0) {
      state.streakFreezes--;
      state.frozeStreak = true;
    } else {
      state.streak      = 0;
      state.frozeStreak = false;
    }
    saveState(state);
  }

  // Mode toggle: show only if daily question has distractors
  const hasFlavor  = !!flavor[q.id];
  const started    = !!(state.days?.[day]);
  const modeBtn    = document.getElementById('mode-btn');
  const savedMode  = state.days?.[day]?.mode ?? getMode();

  if (hasFlavor) {
    modeBtn.removeAttribute('hidden');
    modeBtn.textContent = savedMode === 'mc' ? 'MC' : 'Text';
    if (started) modeBtn.classList.add('locked');
    modeBtn.addEventListener('click', () => {
      if (activeView === 'daily' && started) return;
      const next = getMode() === 'mc' ? 'text' : 'mc';
      setMode(next);
      modeBtn.textContent = next === 'mc' ? 'MC' : 'Text';
      if (activeView === 'endless') mountPractice(data, locale);
      else mount(data, day, q, locale, state, false);
    });
  }

  // View tabs
  const tabDaily   = document.getElementById('tab-daily');
  const tabEndless = document.getElementById('tab-endless');
  tabDaily.textContent   = uiS(ui, 'tab_daily',   locale);
  tabEndless.textContent = uiS(ui, 'tab_endless',  locale);
  document.getElementById('view-tabs').removeAttribute('hidden');

  tabDaily.addEventListener('click', () => {
    if (activeView === 'daily') return;
    activeView = 'daily';
    tabDaily.classList.add('active');
    tabEndless.classList.remove('active');
    if (hasFlavor) modeBtn.removeAttribute('hidden');
    mount(data, day, q, locale, state, false);
  });

  tabEndless.addEventListener('click', () => {
    if (activeView === 'endless') return;
    activeView = 'endless';
    tabEndless.classList.add('active');
    tabDaily.classList.remove('active');
    modeBtn.setAttribute('hidden', '');
    if (!practiceSession) startPractice(questions, data, locale);
    else mountPractice(data, locale);
  });

  // Locale picker
  const picker = document.getElementById('locale-pick');
  picker.value = locale;
  picker.addEventListener('change', e => {
    locale = e.target.value;
    setLocale(locale);
    tabDaily.textContent   = uiS(ui, 'tab_daily',   locale);
    tabEndless.textContent = uiS(ui, 'tab_endless',  locale);
    if (activeView === 'endless') {
      mountPractice(data, locale);
      return;
    }
    document.getElementById('question-text').textContent = renderQ(ents, tmpl, q, locale);
    const inp = document.getElementById('answer-input');
    if (inp) inp.placeholder = uiS(ui, 'enter_answer', locale).trim();
    // Re-label MC buttons if game not yet done
    if (!state.days?.[day] || (!state.days[day].won && state.days[day].guesses.length < MAX_MC)) {
      const grid = document.getElementById('mc-grid');
      if (grid) {
        const options = getMCOptions(ents, q, locale, flavor, day);
        grid.querySelectorAll('.mc-btn').forEach((btn, i) => {
          if (options[i]) btn.textContent = options[i].label;
        });
      }
    }
  });

  setStreak(state.streak ?? 0, state.frozeStreak);
  mount(data, day, q, locale, state, false);
})();
